# Upptime Configuration for Libraté
owner: TheDaoOfCoding
repo: status-librate

sites:
  - name: Libraté Web App
    url: https://www.librate.app
  - name: Libraté Library
    url: https://www.librate.app/library
  - name: Cover CDN (R2)
    url: https://cdn.librate.app
    expectedStatusCodes:
      - 200
      - 204
      - 301
      - 302
      - 304
      - 404

status-website:
  cname: status.librate.app
  logoUrl: https://status.librate.app/librate_minimal_gold_e_cutout.png
  name: Libraté Status
  theme: night
  favicon: https://status.librate.app/favicon.png
  faviconSvg: https://status.librate.app/librate_minimal_gold_e_cutout.png
  themeUrl: https://status.librate.app/librate-theme.css
  customHeadHtml: |
    <link rel="icon" type="image/png" href="https://status.librate.app/favicon.png">
    <link rel="shortcut icon" type="image/png" href="https://status.librate.app/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://status.librate.app/librate-theme.css">
    <style>
      :root {
        --body-background-color: #0d0f14;
        --body-text-color: #f0eff0;
        --card-background-color: #161920;
        --card-border-color: #252830;
        --nav-background-color: #0d0f14;
        --nav-border-bottom-color: #252830;
        --nav-current-border-bottom-color: #c9a84c;
        --up-border-left-color: #4caf84;
        --up-color-color: #f0eff0;
        --tag-color: #4caf84;
        --tag-up-background-color: rgba(76, 175, 132, 0.12);
        --down-border-left-color: #e05c5c;
        --down-background-color: #1c1417;
        --tag-down-background-color: rgba(224, 92, 92, 0.12);
        --degraded-border-left-color: #c9a84c;
        --tag-degraded-background-color: rgba(201, 168, 76, 0.12);
        --change-background-color: #c9a84c;
        --code-color: #c9a84c;
        --code-background-color: #1e2028;
        --submit-button-background-color: #c9a84c;
        --submit-button-border-color: #e0bc6a;
        --submit-button-color: #0d0f14;
      }
      html, body {
        background-color: #0d0f14 !important;
        color: #f0eff0 !important;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      }
      nav {
        background-color: rgba(13, 15, 20, 0.9) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border-bottom: 1px solid #252830 !important;
        padding: 0.85rem 0 !important;
        position: sticky !important;
        top: 0 !important;
        z-index: 50 !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
      }
      nav a.logo {
        display: flex !important;
        align-items: center !important;
        gap: 0.5rem !important;
        text-decoration: none !important;
      }
      nav a.logo img {
        height: 28px !important;
        width: auto !important;
        max-height: 28px !important;
        object-fit: contain !important;
        filter: drop-shadow(0 0 10px rgba(201, 168, 76, 0.25)) !important;
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
      }
      nav a.logo:hover img {
        transform: scale(1.05) !important;
      }
      nav a.logo div {
        display: none !important;
      }
      nav a.logo::after {
        content: "STATUS" !important;
        display: inline-flex !important;
        align-items: center !important;
        font-family: 'JetBrains Mono', monospace !important;
        font-size: 0.65rem !important;
        font-weight: 600 !important;
        letter-spacing: 0.08em !important;
        color: #c9a84c !important;
        background-color: rgba(201, 168, 76, 0.12) !important;
        border: 1px solid rgba(201, 168, 76, 0.28) !important;
        padding: 0.15rem 0.5rem !important;
        border-radius: 9999px !important;
        text-transform: uppercase !important;
        line-height: 1 !important;
        margin-left: 0.35rem !important;
      }
      nav ul li a {
        font-family: 'Inter', sans-serif !important;
        color: #8b8fa8 !important;
      }
      nav ul li a:hover {
        color: #c9a84c !important;
      }
      header h1 {
        font-family: 'Cormorant Garamond', Georgia, serif !important;
        font-size: 2.35rem !important;
        font-weight: 700 !important;
        color: #f0eff0 !important;
      }
      header p.lead {
        color: #8b8fa8 !important;
      }
      h2 {
        font-family: 'Cormorant Garamond', Georgia, serif !important;
        font-size: 1.55rem !important;
        font-weight: 700 !important;
        color: #f0eff0 !important;
      }
      .changed {
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        flex-wrap: wrap !important;
        gap: 1rem !important;
        margin-top: 2.5rem !important;
        margin-bottom: 1.25rem !important;
      }
      .changed h2 {
        margin: 0 !important;
      }
      .changed form,
      form.svelte-fqsq6s,
      .r.svelte-fqsq6s {
        display: inline-flex !important;
        align-items: center !important;
        background-color: #161920 !important;
        border: 1px solid #252830 !important;
        border-radius: 8px !important;
        padding: 3px !important;
        gap: 2px !important;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3) !important;
      }
      .changed form div,
      form.svelte-fqsq6s div {
        display: inline-flex !important;
        align-items: center !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .changed form input[type="radio"],
      form.svelte-fqsq6s input,
      input.svelte-fqsq6s {
        position: absolute !important;
        opacity: 0 !important;
        width: 0 !important;
        height: 0 !important;
        pointer-events: none !important;
        margin: 0 !important;
      }
      .changed form label,
      form.svelte-fqsq6s label,
      .r.svelte-fqsq6s label.svelte-fqsq6s.svelte-fqsq6s,
      label.svelte-fqsq6s {
        font-family: 'JetBrains Mono', monospace !important;
        font-size: 0.72rem !important;
        font-weight: 500 !important;
        color: #8b8fa8 !important;
        background: transparent !important;
        border: 1px solid transparent !important;
        border-radius: 6px !important;
        padding: 0.35rem 0.7rem !important;
        margin: 0 !important;
        min-width: 40px !important;
        text-align: center !important;
        cursor: pointer !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        user-select: none !important;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1) !important;
      }
      .changed form label:hover,
      form.svelte-fqsq6s label:hover,
      label.svelte-fqsq6s:hover {
        color: #f0eff0 !important;
        background-color: rgba(255, 255, 255, 0.05) !important;
      }
      .changed form label:active,
      label.svelte-fqsq6s:active {
        transform: scale(0.96) !important;
      }
      .changed form input[type="radio"]:checked + label,
      form.svelte-fqsq6s input:checked + label,
      .r.svelte-fqsq6s input.svelte-fqsq6s:checked + label.svelte-fqsq6s,
      input:checked + label {
        background-color: rgba(201, 168, 76, 0.15) !important;
        border-color: rgba(201, 168, 76, 0.38) !important;
        color: #c9a84c !important;
        font-weight: 600 !important;
        box-shadow: 0 0 10px rgba(201, 168, 76, 0.18) !important;
      }
      article {
        background-color: #161920 !important;
        border: 1px solid #252830 !important;
        border-left: 1px solid #252830 !important;
        border-radius: 12px !important;
        padding: 1.25rem 1.5rem !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3) !important;
        margin-bottom: 0.85rem !important;
        position: relative !important;
      }
      article:hover {
        border-color: #32363f !important;
        transform: translateY(-1px) !important;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45) !important;
      }
      article.up { border-left: 1px solid #252830 !important; }
      article.down {
        border: 1px solid rgba(224, 92, 92, 0.4) !important;
        border-left: 1px solid rgba(224, 92, 92, 0.6) !important;
        background: linear-gradient(90deg, rgba(224, 92, 92, 0.08) 0%, #161920 60%) !important;
      }
      article.degraded {
        border: 1px solid rgba(201, 168, 76, 0.4) !important;
        border-left: 1px solid rgba(201, 168, 76, 0.6) !important;
        background: linear-gradient(90deg, rgba(201, 168, 76, 0.08) 0%, #161920 60%) !important;
      }
      article.up h4::before {
        content: "" !important;
        display: inline-block !important;
        width: 8px !important;
        height: 8px !important;
        border-radius: 50% !important;
        background-color: #4caf84 !important;
        box-shadow: 0 0 8px rgba(76, 175, 132, 0.6) !important;
        margin-right: 0.65rem !important;
        vertical-align: 0.08rem !important;
      }
      article.down h4::before {
        content: "" !important;
        display: inline-block !important;
        width: 8px !important;
        height: 8px !important;
        border-radius: 50% !important;
        background-color: #e05c5c !important;
        box-shadow: 0 0 8px rgba(224, 92, 92, 0.6) !important;
        margin-right: 0.65rem !important;
        vertical-align: 0.08rem !important;
      }
      article.degraded h4::before {
        content: "" !important;
        display: inline-block !important;
        width: 8px !important;
        height: 8px !important;
        border-radius: 50% !important;
        background-color: #c9a84c !important;
        box-shadow: 0 0 8px rgba(201, 168, 76, 0.6) !important;
        margin-right: 0.65rem !important;
        vertical-align: 0.08rem !important;
      }
      article h4 {
        font-family: 'Cormorant Garamond', Georgia, serif !important;
        font-size: 1.25rem !important;
        font-weight: 700 !important;
        color: #f0eff0 !important;
        display: flex !important;
        align-items: center !important;
      }
      article h4 a { color: #f0eff0 !important; text-decoration: none !important; }
      article h4 a:hover { color: #c9a84c !important; }
      article h4 img.icon { display: none !important; }
      .tag, span.tag, article span.tag {
        font-family: 'JetBrains Mono', monospace !important;
        font-size: 0.72rem !important;
        font-weight: 600 !important;
        border-radius: 9999px !important;
        padding: 0.2rem 0.65rem !important;
        text-transform: uppercase !important;
      }
      .tag.up, span.tag.up, article span.tag.up {
        background-color: rgba(76, 175, 132, 0.12) !important;
        border: 1px solid rgba(76, 175, 132, 0.3) !important;
        color: #4caf84 !important;
      }
      .tag.down, span.tag.down, article span.tag.down {
        background-color: rgba(224, 92, 92, 0.12) !important;
        border: 1px solid rgba(224, 92, 92, 0.3) !important;
        color: #e05c5c !important;
      }
      .tag.degraded, span.tag.degraded, article span.tag.degraded {
        background-color: rgba(201, 168, 76, 0.12) !important;
        border: 1px solid rgba(201, 168, 76, 0.3) !important;
        color: #c9a84c !important;
      }
      article div {
        font-family: 'Inter', sans-serif !important;
        color: #8b8fa8 !important;
      }
      article .data {
        font-family: 'JetBrains Mono', monospace !important;
        font-weight: 600 !important;
        color: #f0eff0 !important;
      }
      article.graph { background-image: none !important; }
      section article.down.link {
        border: 1px solid rgba(224, 92, 92, 0.35) !important;
        border-left: 1px solid rgba(224, 92, 92, 0.6) !important;
        background: linear-gradient(90deg, rgba(224, 92, 92, 0.08) 0%, #161920 60%) !important;
        border-radius: 12px !important;
      }
      section article.down.link a {
        color: #e05c5c !important;
        font-family: 'Inter', sans-serif !important;
        font-weight: 500 !important;
        text-decoration: none !important;
      }
      section article.down.link a:hover {
        text-decoration: underline !important;
      }
      footer {
        text-align: center !important;
        font-size: 0.75rem !important;
        opacity: 0.65 !important;
        color: #8b8fa8 !important;
      }
      footer a { color: #c9a84c !important; }
    </style>
  introTitle: "**Libraté System Status**"
  introMessage: Real-time service health, uptime, and latency for Libraté.
  navbar:
    - title: Status
      href: /
    - title: Go to Libraté
      href: https://www.librate.app

i18n:
  footer: "This page is powered by [Upptime](https://upptime.js.org)."